name: Bicep Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'bicep/**'
      - '.github/workflows/bicep-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ先の環境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  id-token: write
  contents: read

env:
  AZURE_LOCATION: japaneast

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    concurrency:
      group: deploy-${{ github.event.inputs.environment || 'production' }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep CLI
        run: az bicep install

      - name: Bicep Build (構文チェック)
        run: az bicep build --file bicep/main.bicep

      - name: Bicep What-If (最終確認)
        run: |
          az deployment sub what-if \
            --location ${{ env.AZURE_LOCATION }} \
            --template-file bicep/main.bicep \
            --parameters environmentName=${{ github.event.inputs.environment || 'prod' }} \
                         orgPrefix=${{ vars.ORG_PREFIX }} \
                         managementGroupRootId=${{ vars.MANAGEMENT_GROUP_ROOT_ID }} \
            --no-prompt

      - name: Bicep Deploy
        id: deploy
        run: |
          DEPLOYMENT_NAME="lz-deploy-$(date +%Y%m%d-%H%M%S)"
          az deployment sub create \
            --name "$DEPLOYMENT_NAME" \
            --location ${{ env.AZURE_LOCATION }} \
            --template-file bicep/main.bicep \
            --parameters environmentName=${{ github.event.inputs.environment || 'prod' }} \
                         orgPrefix=${{ vars.ORG_PREFIX }} \
                         managementGroupRootId=${{ vars.MANAGEMENT_GROUP_ROOT_ID }} \
            --no-prompt

      - name: Azure Logout
        if: always()
        run: az logout
